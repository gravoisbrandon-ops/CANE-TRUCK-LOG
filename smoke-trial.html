<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smoke Map Trial</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#e8ece8;--ink:#1a2a1f;--card:#fff;--line:#c9d1ca;--mut:#5d6b61}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;flex-direction:column;min-height:100%}
#bar{padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:11px;gap:2px;color:var(--mut)}
input,select,button{font:inherit;font-size:15px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:36px}
input[type=number]{width:70px}button{cursor:pointer;font-weight:600}
#map{flex:none;height:55vh;min-height:300px}
#bar,#strip,#info,#ban{flex:none}
#strip{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
.hr{flex:0 0 auto;min-width:74px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;line-height:1.3;cursor:pointer;text-align:center;background:#fff}
.hr b{display:block;font-size:13px}.hr.in{outline:2px solid #1a2a1f}
.Poor{background:#f6d5d1}.Fair{background:#f7e6bf}.Good{background:#d7ecd0}
#info{padding:8px 12px;background:var(--card);border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.lab{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:11px;font-weight:700;white-space:nowrap}
small{color:var(--mut);font-size:12px}
</style></head><body><div id="app">
<div id="ban" style="background:#1a2a1f;color:#fff;padding:5px 12px;font-size:12px">TRIAL VERSION. An estimate only, not an official smoke model.</div>
<div id="bar">
<label><b style="color:#1a2a1f">Start time</b><select id="st" style="font-weight:700"></select></label>
<label>Fire burns (hrs)<input type="number" id="dur" min="1" max="12" value="1"></label>
<label style="flex-direction:row;align-items:center;gap:6px;font-size:13px;color:#1a2a1f"><input type="checkbox" id="ash" style="min-height:0;width:20px;height:20px">Standing cane (ash)</label>
<details id="more" style="width:100%"><summary style="cursor:pointer;font-size:13px;color:#5d6b61">More settings</summary>
<div style="display:flex;flex-wrap:wrap;gap:6px 10px;padding-top:6px">
<label>Smoke lingers (hrs)<input type="number" id="fol" min="1" max="12" value="2"></label>
<label>Spread (+/- deg)<input type="number" id="sp" min="5" max="45" value="20"></label>
<label>Road hazard out to (mi)<input type="number" id="lim" min="1" max="60" value="5"></label>
<label>Ash seen to (mi)<input type="number" id="ashd" min="1" max="30" placeholder="auto"></label>
<button id="here" type="button">My location</button>
</div></details>
</div>
<div id="map"></div>
<div id="strip"></div>
<div id="info">Loading the forecast...</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
var MI=1609.344,R=6371000,D2R=Math.PI/180,M2FT=3.28084;
var C=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
var $=function(i){return document.getElementById(i);};
var Q=new URLSearchParams(location.search), qlat=parseFloat(Q.get('lat')), qlon=parseFloat(Q.get('lon')), qt=Q.get('t')||'', fromLog=isFinite(qlat)&&isFinite(qlon);
var src=fromLog?{lat:qlat,lng:qlon}:{lat:30.03,lng:-90.77}, H=null, startT=qt, nowT=''; /* H: hourly arrays */
var map=L.map('map').setView([src.lat,src.lng],9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
var fireIcon=L.divIcon({className:'',html:'<div style="font-size:30px;line-height:30px;text-align:center;width:34px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">&#128293;</div>',iconSize:[34,34],iconAnchor:[17,30]});
var marker=L.marker([src.lat,src.lng],{draggable:true,icon:fireIcon,title:'Start of the fire. Drag to move.'}).addTo(map), layer=L.layerGroup().addTo(map);
function dest(lat,lng,brg,m){var a=m/R,b=brg*D2R,p=lat*D2R,l=lng*D2R;
 var p2=Math.asin(Math.sin(p)*Math.cos(a)+Math.cos(p)*Math.sin(a)*Math.cos(b));
 var l2=l+Math.atan2(Math.sin(b)*Math.sin(a)*Math.cos(p),Math.cos(a)-Math.sin(p)*Math.sin(p2));
 return [p2/D2R,((l2/D2R+540)%360)-180];}
function comp(d){return C[Math.round(((d%360)+360)%360/22.5)%16];}
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dd(t){ return DN[new Date(t.slice(0,10)+'T12:00:00').getDay()]; }
function hh(t){var h=parseInt(t.slice(11,13),10);return (h%12||12)+(h<12?'a':'p');}
/* rough rule of thumb, not an official rating */
function rate(i){ var ft=H.mix[i]*M2FT, sp=H.sp[i], night=!H.day[i];
 if(night||ft<1500||sp<5) return 'Poor'; if(ft<3000||sp<8) return 'Fair'; return 'Good'; }
function load(){
 $('info').textContent='Loading the forecast...';
 var u='https://api.open-meteo.com/v1/forecast?latitude='+src.lat+'&longitude='+src.lng+'&hourly=wind_speed_80m,wind_direction_80m,boundary_layer_height,is_day,relative_humidity_2m&wind_speed_unit=mph&past_days=2&forecast_days=3&timezone=auto';
 fetch(u).then(function(r){return r.json();}).then(function(j){
  var h=j.hourly; if(!h||!h.time) throw 0;
  var nowL=new Date(Date.now()+(j.utc_offset_seconds||0)*1000).toISOString().slice(0,13), ni=0;
  for(var i=0;i<h.time.length;i++){ if(h.time[i].slice(0,13)>=nowL){ni=i;break;} }
  var a0=Math.max(0,ni-48), a1=ni+48; nowT=h.time[ni];
  H={t:h.time.slice(a0,a1),sp:h.wind_speed_80m.slice(a0,a1),dir:h.wind_direction_80m.slice(a0,a1),mix:h.boundary_layer_height.slice(a0,a1),day:h.is_day.slice(a0,a1),rh:(h.relative_humidity_2m||[]).slice(a0,a1)};
  buildStart(); draw();
 }).catch(function(){ $('info').textContent='Could not read the forecast. Check your connection and tap My location.'; });
}
function buildStart(){ var s=$('st'); s.innerHTML=H.t.map(function(t,i){return '<option value="'+i+'">'+(t===nowT?'Now ('+hh(t)+')':dd(t)+' '+hh(t)+(t<nowT?' (past)':''))+'</option>';}).join('');
 var want=startT?startT.slice(0,13):nowT.slice(0,13), idx=0; for(var i=0;i<H.t.length;i++){ if(H.t[i].slice(0,13)>=want){ idx=i; break; } } s.value=String(idx); }
function draw(){
 if(!H) return; layer.clearLayers();
 var st=parseInt($('st').value||0,10); if(H.t[st]) startT=H.t[st]; var _x=null, dur=Math.max(1,Math.min(12,+$("dur").value||1)), fol=Math.max(1,Math.min(12,+$("fol").value||2)),
     half=Math.max(5,Math.min(45,+$('sp').value||20)), mark=1e9, n=H.t.length, tn=Math.tan(half*D2R);
 var ashMax=0, ashMin=null, reach=0, reachHr=null, poor=0, nightH=0, fog=0, cols={Poor:'#c0392b',Fair:'#d68910',Good:'#2e8b57'};
 for(var k=0;k<dur;k++){
  var r=st+k; if(r>=n) break; if(H.rh[r]>=90 && !H.day[r]) fog++; var rt=rate(r), lat=src.lat,lng=src.lng, dist=0, path=[[lat,lng]];
  var lim=(+$('lim').value||5)*(rt==='Poor'?3:1), pd=0, pa=[lat,lng];
  for(var h=0;h<fol;h++){ var i=Math.min(r+h,n-1), to=(H.dir[i]+180)%360, step=H.sp[i]*MI; var nx=dest(lat,lng,to,step);
   var d0=dist, d1=dist+H.sp[i]; if(d0>=lim) break; var f=Math.min(1,(lim-d0)/H.sp[i]); if(f<1){ nx=dest(lat,lng,to,step*f); d1=d0+H.sp[i]*f; }
   var w0=Math.max(0.3,d0*tn)*MI, w1=Math.max(0.3,d1*tn)*MI, a0=dest(lat,lng,to-90,w0), b0=dest(lat,lng,to+90,w0), a1=dest(nx[0],nx[1],to-90,w1), b1=dest(nx[0],nx[1],to+90,w1);
   L.polygon([a0,a1,b1,b0],{color:cols[rt],weight:1,opacity:Math.max(.25,.8*(1-(d0+d1)/2/lim)),fillColor:cols[rt],fillOpacity:Math.max(.08,.34*(1-(d0+d1)/2/lim))}).addTo(layer);
   lat=nx[0];lng=nx[1];dist=d1; path.push([lat,lng]); if(dist>reach){reach=dist;} if(!H.day[i]) nightH++; if(reachHr==null && dist>=mark) reachHr=h+1; }
  if($('ash').checked){ var ai=Math.min(r,n-1), mps=H.sp[ai]*0.44704, Hl=Math.min(600,Math.max(150,H.mix[ai]||300)), ad=parseFloat($('ashd').value), toA=(H.dir[ai]+180)%360, dHv, dLt;
   if(ad>0){ dLt=ad; dHv=ad/3; } else { dHv=mps*Hl/1.0/MI; dLt=mps*Hl/0.3/MI; dLt=Math.min(dLt,15); dHv=Math.min(dHv,dLt/2); }
   ashMax=Math.max(ashMax,dLt); ashMin=ashMin==null?dHv:Math.min(ashMin,dHv);
   [[dLt,.14],[dHv,.32]].forEach(function(z){ var p=[[src.lat,src.lng]]; for(var a=-15;a<=15;a+=3) p.push(dest(src.lat,src.lng,toA+a,z[0]*MI)); L.polygon(p,{stroke:false,fillColor:'#3d3d3d',fillOpacity:z[1]}).addTo(layer); }); }
  if(rt==='Poor') poor++;
  L.polyline(path,{color:cols[rt],weight:1.5,opacity:.7}).addTo(layer);
 }
 var rmax=Math.max(reach,ashMax,1), stp=rmax<=6?1:5, rEnd=Math.ceil(rmax/stp)*stp;
 for(var rg=stp;rg<=rEnd+0.001;rg+=stp){ L.circle([src.lat,src.lng],{radius:rg*MI,color:'#7f8c8d',weight:.7,fill:false,dashArray:'4 4'}).addTo(layer);
  L.marker(dest(src.lat,src.lng,0,rg*MI),{interactive:false,icon:L.divIcon({className:'',html:'<span class="lab">'+rg+' mi</span>',iconSize:[0,0]})}).addTo(layer); }
 var s0=Math.min(st,n-1), d0=H.dir[s0], sp0=H.sp[s0];
 $('info').innerHTML='<b>Lit at '+dd(H.t[s0])+' '+hh(H.t[s0])+'.</b> The wind about 260 ft up is from <b>'+comp(d0)+'</b> at <b>'+Math.round(sp0)+' mph</b>, so smoke heads <b>'+comp(d0+180)+'</b>. Over the next '+fol+' hours smoke could be a hazard for drivers out to about <b>'+Math.round(reach)+' miles</b> from the fire, and thin enough beyond that'+(reachHr?' (past the '+mark+' mile mark)':'')+'. '+
  (poor?'<b>'+poor+' of '+dur+' burn hours</b> have poor dispersal (night, low mixing height or light wind). ':'')+(fog?'<b>Humidity is 90% or more on '+fog+' night burn hour'+(fog===1?'':'s')+'</b>, so fog and smoke can combine on the roads. Keep drivers away or plan for signs. ':'')+(nightH?'Smoke is still in the air after dark for part of this, when it can stay low and thick. ':'')+
  (ashMax?'<br><b>Ash:</b> heavy fallout within about '+(Math.round(ashMin*10)/10)+' mi of the field, light flakes out to about '+(Math.round(ashMax*10)/10)+' mi (gray shading). '+($('ashd').value?'Using the distance you set.':'Estimated from the wind and mixing height. Type a distance in Ash seen to if your burns land ash farther or closer.'):'')+'<br><small>Shaded paths fade as the smoke thins and stop where it should no longer matter (the road hazard distance you set, tripled on poor-dispersal hours). One path per hour the fire burns, red = poor, amber = fair, green = good dispersal. Estimate only, from one forecast point, using the wind about 260 ft up and a rough rule of thumb. Not an official smoke model.</small>';
 var cur=null; $('strip').innerHTML=H.t.map(function(t,i){ return i; }).filter(function(i){ return i>=Math.max(0,st-1) && i<st+36; }).map(function(i){ var t=H.t[i], rt=rate(i); return '<div class="hr '+rt+(i>=st&&i<st+dur?' in':'')+'" data-i="'+i+'"><b>'+(t===nowT?'Now':hh(t))+'</b>'+comp(H.dir[i])+' '+Math.round(H.sp[i])+' mph<br>'+Math.round(H.mix[i]*M2FT/100)/10+'k ft<br>'+rt+'</div>'; }).join('');
 var sh=$('strip').querySelector('.hr.in'); if(sh) $('strip').scrollLeft=Math.max(0,sh.offsetLeft-12);
 try{ var bnd=L.circle([src.lat,src.lng],{radius:Math.max(reach,ashMax,1)*1.1*MI}).getBounds(); map.fitBounds(bnd,{padding:[10,10]}); }catch(e){}
}
function setSrc(ll){src={lat:ll.lat,lng:ll.lng};marker.setLatLng(ll);load();}
map.on('click',function(e){setSrc(e.latlng);});
marker.on('dragend',function(){setSrc(marker.getLatLng());});
['st','dur','fol','sp','lim','ash','ashd'].forEach(function(i){$(i).addEventListener('input',draw);});
$('strip').addEventListener('click',function(e){var d=e.target.closest('.hr'); if(!d) return; $('st').value=d.getAttribute('data-i'); draw();});
function locate(first){ if(!navigator.geolocation){ load(); return; } navigator.geolocation.getCurrentPosition(function(p){ setSrc({lat:p.coords.latitude,lng:p.coords.longitude}); },function(){ if(!first) $('info').textContent='Could not get your location. Tap the map to place the pin.'; load(); },{enableHighAccuracy:true,timeout:10000,maximumAge:60000}); }
$('here').addEventListener('click',function(){locate(false);});
if(Q.get('ash')==='1') $('ash').checked=true; if(Q.get('hrs')) $('dur').value=Math.max(1,Math.min(12,parseInt(Q.get('hrs'),10)||1)); if(fromLog){ $('info').textContent='Loading the forecast for your burn...'; load(); } else locate(true); setInterval(load,1800000);
})();
</script></body></html>
